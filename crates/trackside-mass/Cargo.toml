[package]
name = "trackside-mass"
description = "Music Assistant client: one supervised WebSocket connection, typed commands and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `testing::FakeAssistant`, a scripted Music Assistant for other crates' tests.
testing = ["tokio-tungstenite/handshake"]

[dependencies]
tokio.workspace = true
tokio-util = { workspace = true, features = ["time"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
fastrand.workspace = true
log.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
