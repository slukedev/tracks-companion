# Acquisition: lets the server get songs you do not have yet, through yt-dlp. Layer it on top
# of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.acquire.yaml up -d
#
# Before the first start (docs/ops/acquisition.md explains each step):
#
#   mkdir -p acquired
#   sudo chown -R 65532:65532 acquired
#
# Nothing is fetched until an admin enables the source in the dashboard.

services:
  trackside:
    image: ghcr.io/slukedev/trackside:${TRACKSIDE_ACQUIRE_TAG:-acquire}
    volumes:
      # The writable library acquired songs are filed into. Add it in the dashboard as a
      # library with the folder /acquired, then choose it under Acquisition.
      - ./acquired:/acquired
