# Package metadata for cargo-deb. cargo-deb only reads it from the crate's own manifest, so
# this table is copied verbatim into Server/crates/trackside-server/Cargo.toml (WP6 owns that
# file). Paths are relative to that crate's directory. Keep the two in sync; CI fails the
# package build when they differ (see .github/workflows/server.yml, job "packages").
#
# Build:  cd Server && cargo deb -p trackside-server --target x86_64-unknown-linux-musl --no-build

[package.metadata.deb]
name = "trackside"
maintainer = "Trackside maintainers <https://github.com/slukedev/tracks/issues>"
copyright = "Trackside contributors"
license-file = ["../../../LICENSE", "0"]
extended-description = """\
Trackside indexes the music you own and serves it to the Tracks app over a native API, and to \
other music apps over Subsonic and OpenSubsonic. It keeps per-user listens, favourites and \
playlists, and runs as a single binary with an embedded web dashboard."""
section = "sound"
priority = "optional"
depends = "$auto"
recommends = "ffmpeg"
assets = [
    ["target/release/trackside", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/trackside/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/trackside/CHANGELOG.md", "644"],
    ["../../packaging/linux/trackside.env", "etc/trackside/trackside.env", "644"],
]
conf-files = ["/etc/trackside/trackside.env"]
maintainer-scripts = "../../packaging/deb/scripts"
systemd-units = { unit-name = "trackside", unit-scripts = "../../packaging/systemd", enable = true, start = false, restart-after-upgrade = true }
