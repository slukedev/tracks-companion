# Reach Trackside from anywhere over your tailnet, with HTTPS from Tailscale and no open
# ports. Layer it on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d
#
# Needs in .env: TS_AUTHKEY (an auth key from the Tailscale admin console) and
# TRACKSIDE_TAILNET_URL (https://trackside.<your-tailnet>.ts.net once the machine shows up).
# Turn on MagicDNS and HTTPS certificates for the tailnet first.
# docs/ops/remote-access.md walks through it.

services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: trackside-tailscale
    hostname: ${TS_HOSTNAME:-trackside}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    # Trackside shares this container's network, so its LAN port is published here.
    ports:
      - "${TRACKSIDE_PORT:-4747}:4747"

  trackside:
    network_mode: service:tailscale
    ports: !reset []
    depends_on:
      - tailscale
    environment:
      TRACKSIDE_SERVER__PUBLIC_URLS: ${TRACKSIDE_TAILNET_URL:?set TRACKSIDE_TAILNET_URL in .env}
      # Tailscale serve connects from loopback and adds X-Forwarded-For.
      TRACKSIDE_SERVER__TRUSTED_PROXIES: "127.0.0.1/32,::1/128"

volumes:
  tailscale-state:
