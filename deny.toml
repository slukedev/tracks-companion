# cargo-deny policy for the Trackside workspace: run `cargo deny check` from the repository root.
# Trackside is GPL-3.0-only, so every dependency's license must be one GPL-3.0 code may use.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Report unmaintained crates anywhere in the graph, not only direct dependencies. This was the
# default before cargo-deny 0.22, which narrowed it to the workspace.
unmaintained = "all"
# Add an advisory here only with a comment saying why it does not affect Trackside and
# when to look again.
ignore = [
    # paste is a compile-time macro used by lofty. Unmaintained, but it runs only in the
    # compiler and has no known vulnerability. Look again when lofty drops it.
    { id = "RUSTSEC-2024-0436", reason = "build-time only, via lofty" },
    # chrono is unmaintained, with no known vulnerability. Only rustls-acme 0.15 (the `acme`
    # feature) uses it, to read certificate validity dates. Look again when rustls-acme drops it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; via rustls-acme only" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# CDLA-Permissive-2.0 (webpki-roots) and MPL-2.0 arrive with features not always enabled.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The workspace crates and tracks-model are GPL-3.0-only and unpublished.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS is rustls with ring everywhere (architecture section 10); OpenSSL would bring a
    # C toolchain into the musl cross builds.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
    # ADR 0002: one SQLite access layer.
    { crate = "sqlx", reason = "rusqlite only (ADR 0002)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/slukedev/tracks"]
