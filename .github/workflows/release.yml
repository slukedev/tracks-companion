# Release artifacts for a published GitHub release named trackside-vX.Y.Z (trackside-vX.Y.Z-rc.N
# for a pre-release): static musl binaries for x86_64 and aarch64, .deb and .rpm packages and
# SHA256SUMS, all attached to the release with build provenance. images.yml publishes the images for the same release.
# docs/ops/releasing.md has the checklist.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.release.tag_name }}

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux binaries and packages
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, Cargo.toml, changelog and packaging agree
        run: |
          [[ "$TAG" =~ ^trackside-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::release tag $TAG is not trackside-vX.Y.Z"; exit 1; }
          version="${TAG#trackside-v}"
          cargo_version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$cargo_version" == "$version" ]] || {
            echo "::error::Cargo.toml has version $cargo_version, the release is $version"; exit 1; }
          grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          python3 -I packaging/scripts/check-packaging.py
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux
      - name: Install zig
        run: |
          python3 -m pip install --user --break-system-packages ziglang==0.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-zigbuild@0.24.1,cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - name: Build static binaries
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p trackside-server --bin trackside --target "$target"
          done
      - name: Tarballs, .deb and .rpm
        run: |
          version="${TAG#trackside-v}"
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            name="trackside-${version}-${target}"
            mkdir -p "stage/$name"
            cp "target/$target/release/trackside" README.md CHANGELOG.md LICENSE \
              packaging/systemd/trackside.service packaging/linux/trackside.env "stage/$name/"
            tar -C stage -czf "dist/$name.tar.gz" "$name"
            cargo deb -p trackside-server --target "$target" --no-build --no-strip --output dist/
            cargo generate-rpm -p crates/trackside-server --target "$target" --output dist/
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    needs: [linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS)
          {
            echo "### SHA256SUMS"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
