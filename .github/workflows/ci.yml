# Checks for Trackside, on GitHub-hosted runners. Pushes to main and pull requests run one
# Linux job with every check. Nothing here builds or publishes images: people running main
# build it at install time (packaging/compose.build.yaml).
#
# Pull request and release images: images.yml. Release binaries and packages: release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Keep in step with the FFMPEG_IMAGE argument in packaging/docker/Dockerfile, so
  # the ffmpeg tests run against the build the images ship.
  FFMPEG_IMAGE: docker.io/mwader/static-ffmpeg:9.1@sha256:dd09509d8c2152bfa601c8c20e3dd166bde906d37951b9f7e8bbd922267f5ac9

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # GitHub's standard runners have about 14 GB free; a Rust release build plus Docker
      # layers can run out. Preinstalled toolchains this job doesn't use free about 20 GB more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1
      - name: Install the ffmpeg the images ship
        run: |
          id=$(docker create "$FFMPEG_IMAGE")
          sudo docker cp "$id:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$id:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$id"
          ffmpeg -hide_banner -version | head -n 1

      - name: Format
        run: cargo fmt --all --check
      - name: Dashboard (endpoint coverage, fixtures, no external URLs, CSP-safe markup)
        run: node dashboard/dev/check-coverage.mjs
      - name: Packaging metadata, versions and image pins
        run: python3 -I packaging/scripts/check-packaging.py --allow-missing-metadata
      - name: Compose files
        working-directory: packaging
        env:
          TS_AUTHKEY: ci-check
          TRACKSIDE_TAILNET_URL: https://trackside.example.ts.net
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.acquire.yaml config -q
          docker compose -f compose.yaml -f compose.tailscale.yaml config -q
          docker compose -f compose.yaml -f compose.music-assistant.yaml config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
          TRACKSIDE_BUILD_TARGET=acquire docker compose -f compose.yaml -f compose.acquire.yaml -f compose.build.yaml config -q
          for f in nas/truenas/compose.yaml nas/synology/compose.yaml nas/casaos/docker-compose.yml; do
            docker compose -f "$f" config -q
          done
          python3 -c "import json; json.load(open('tailscale-serve.json'))"
          python3 -c "import xml.dom.minidom as m; m.parse('nas/unraid/trackside.xml')"
      - name: Dockerfile lint
        run: docker buildx build --check -f packaging/docker/Dockerfile .
      - name: systemd unit
        working-directory: packaging/systemd
        run: |
          sudo install -m 0755 /bin/true /usr/bin/trackside
          systemd-analyze verify ./trackside.service
          systemd-analyze security --offline=yes --threshold=25 ./trackside.service
          sudo rm /usr/bin/trackside
      - name: Shell scripts
        working-directory: packaging
        run: shellcheck docker/smoke-test.sh docker/image-tags.sh deb/scripts/postinst
      - name: Dependencies (cargo deny)
        run: cargo deny --locked check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without the acquire feature
        run: cargo clippy -p trackside-server --no-default-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Tests that need ffmpeg
        env:
          TRACKSIDE_TEST_FFMPEG: "1"
        run: cargo test --locked -p trackside-media -p trackside-acquire
      - name: End to end at 50k songs, compared with the stored baseline
        run: |
          cargo run --release --locked -p trackside-e2e -- \
            --songs 50000 \
            --baseline tests-e2e/baseline-50k.json \
            --max-regression 25 \
            --report target/e2e-50k.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: target/e2e-50k.json
          if-no-files-found: ignore
          retention-days: 14

