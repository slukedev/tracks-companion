# Checks for Trackside. Pushes to main and pull requests run one Linux job with every check.
# On main, the edge job then builds amd64 and arm64 on an x64 runner (the Dockerfile
# cross-compiles, so no emulation), smoke tests amd64, and pushes and signs edge and
# edge-<commit>.
#
# Pull request and release images: images.yml. Release binaries and packages: release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Keep in step with the FFMPEG_IMAGE argument in packaging/docker/Dockerfile, so
  # the ffmpeg tests run against the build the images ship.
  FFMPEG_IMAGE: docker.io/mwader/static-ffmpeg:9.1@sha256:dd09509d8c2152bfa601c8c20e3dd166bde906d37951b9f7e8bbd922267f5ac9

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1
      - name: Install the ffmpeg the images ship
        run: |
          id=$(docker create "$FFMPEG_IMAGE")
          sudo docker cp "$id:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$id:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$id"
          ffmpeg -hide_banner -version | head -n 1

      - name: Format
        run: cargo fmt --all --check
      - name: Dashboard (endpoint coverage, fixtures, no external URLs, CSP-safe markup)
        run: node dashboard/dev/check-coverage.mjs
      - name: Packaging metadata, versions and image pins
        run: python3 -I packaging/scripts/check-packaging.py --allow-missing-metadata
      - name: Compose files
        working-directory: packaging
        env:
          SLSKD_API_KEY: ci-check-0123456789abcdef
          SLSKD_WEB_PASSWORD: ci-check
          SOULSEEK_USERNAME: ci-check
          SOULSEEK_PASSWORD: ci-check
          TS_AUTHKEY: ci-check
          TRACKSIDE_TAILNET_URL: https://trackside.example.ts.net
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.acquire.yaml config -q
          docker compose -f compose.yaml -f compose.tailscale.yaml config -q
          for f in nas/truenas/compose.yaml nas/synology/compose.yaml nas/casaos/docker-compose.yml; do
            docker compose -f "$f" config -q
          done
          python3 -c "import json; json.load(open('tailscale-serve.json'))"
          python3 -c "import xml.dom.minidom as m; m.parse('nas/unraid/trackside.xml')"
      - name: Dockerfile lint
        run: docker buildx build --check -f packaging/docker/Dockerfile .
      - name: systemd unit
        working-directory: packaging/systemd
        run: |
          sudo install -m 0755 /bin/true /usr/bin/trackside
          systemd-analyze verify ./trackside.service
          systemd-analyze security --offline=yes --threshold=25 ./trackside.service
          sudo rm /usr/bin/trackside
      - name: Shell scripts
        working-directory: packaging
        run: shellcheck docker/smoke-test.sh docker/image-tags.sh deb/scripts/postinst
      - name: Dependencies (cargo deny)
        run: cargo deny --locked check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without the acquire feature
        run: cargo clippy -p trackside-server --no-default-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Tests that need ffmpeg
        env:
          TRACKSIDE_TEST_FFMPEG: "1"
        run: cargo test --locked -p trackside-media -p trackside-acquire
      - name: End to end at 50k songs, compared with the stored baseline
        run: |
          cargo run --release --locked -p trackside-e2e -- \
            --songs 50000 \
            --baseline tests-e2e/baseline-50k.json \
            --max-regression 25 \
            --report target/e2e-50k.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: target/e2e-50k.json
          if-no-files-found: ignore
          retention-days: 14

  edge:
    name: Edge (amd64 and arm64)
    needs: [check]
    if: github.event_name == 'push'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trackside" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: trackside-amd64
          platforms: linux/amd64,linux/arm64
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      - name: Build and push slim by digest
        id: slim
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: slim
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build and push standard by digest
        id: standard
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: standard
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build and push acquire by digest
        id: acquire
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: acquire
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max

      # The tags move only once every variant has passed.
      - name: Smoke test each variant (amd64)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SLIM: ${{ steps.slim.outputs.digest }}
          STANDARD: ${{ steps.standard.outputs.digest }}
          ACQUIRE: ${{ steps.acquire.outputs.digest }}
        run: |
          for pair in "slim $SLIM" "standard $STANDARD" "acquire $ACQUIRE"; do
            read -r variant digest <<< "$pair"
            docker pull --quiet --platform linux/amd64 "$IMAGE@$digest"
            packaging/docker/smoke-test.sh "$IMAGE@$digest" "$variant"
          done
      - name: Tag edge and sign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
          SLIM: ${{ steps.slim.outputs.digest }}
          STANDARD: ${{ steps.standard.outputs.digest }}
          ACQUIRE: ${{ steps.acquire.outputs.digest }}
        run: |
          for pair in "slim $SLIM" "standard $STANDARD" "acquire $ACQUIRE"; do
            read -r variant digest <<< "$pair"
            packaging/docker/image-tags.sh "$variant" edge "$REVISION" > "tags-$variant"
            packaging/docker/publish-manifest.sh "$variant" "tags-$variant" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done
